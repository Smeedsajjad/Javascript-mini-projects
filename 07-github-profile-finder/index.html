<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>GitHub Profile Finder</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- GitHub-style Header -->
    <header class="github-header">
      <div class="header-inner">
        <a href="#" class="github-logo" aria-label="GitHub">
          <svg viewBox="0 0 16 16" width="32" height="32" aria-hidden="true">
            <path
              fill="currentColor"
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
              0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
              -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
              .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95
              0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12
              0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27
              .68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82
              .44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15
              0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48
              0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38
              A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"
            />
          </svg>
        </a>

        <div class="header-content">
          <div>
            <h1>GitHub Profile Finder</h1>
            <p>
              Browse users and their profiles
              <a
                href="https://docs.github.com/en/rest?apiVersion=2026-03-10"
                target="_blank"
                rel="noopener noreferrer"
              >
                via the GitHub API
              </a>
            </p>
          </div>

          <div class="search-wrapper">
            <svg
              class="search-icon"
              viewBox="0 0 16 16"
              width="16"
              height="16"
              aria-hidden="true"
            >
              <path
                fill="currentColor"
                d="M11.7 10.3a6 6 0 1 0-1.4 1.4l3.5 3.5
                1.4-1.4-3.5-3.5zM7 11a4 4 0 1 1 0-8
                4 4 0 0 1 0 8z"
              />
            </svg>

            <input
              type="search"
              placeholder="Search GitHub users..."
              aria-label="Search GitHub users"
            />
          </div>
        </div>
      </div>
    </header>

    <main class="container">
      <!-- Search Result -->
      <div id="found" class="result-info" hidden>
        <span>
          Found <strong id="total_results">460</strong> results for
          <strong id="searched">torvalds</strong>
        </span>
      </div>
      <!-- User Cards -->
      <section class="cards" aria-label="GitHub users">
        <!-- <article class="card">
          <img
            src="https://avatars.githubusercontent.com/u/1024025?v=4&s=180"
            alt="Linus Torvalds"
          />

          <div class="card-info">
            <h2>Linus Torvalds</h2>
            <p>@torvalds</p>

            <span class="view-profile">
              View profile →
            </span>
          </div>
        </article> -->
      </section>

      <div class="pagination" id="pagination" hidden>
        <button id="previous" type="button">← Previous</button>

        <div id="page_numbers"></div>

        <button id="next" type="button">Next →</button>
      </div>

      <!-- Profile Details -->
      <section class="details" hidden>
        <button id="back-button" type="button" class="back-button">
          ← Back to searches
        </button>

        <div class="profile-sidebar">
          <img class="profile-avatar" src="" alt="Profile avatar" />

          <h1 class="profile-name"></h1>

          <p class="username"></p>

          <p class="bio"></p>

          <button class="follow-btn" type="button">View GitHub Profile</button>

          <div class="profile-stats">
            <div>
              <strong class="followers-count">0</strong>
              <span>Followers</span>
            </div>

            <div>
              <strong class="following-count">0</strong>
              <span>Following</span>
            </div>

            <div>
              <strong class="repo-count">0</strong>
              <span>Repositories</span>
            </div>
          </div>
        </div>

        <div class="repositories">
          <div class="section-header">
            <h2>Repositories</h2>

            <span class="repo-count-badge"> 0 </span>
          </div>

          <!-- THIS MUST EXIST -->
          <div class="repo-list"></div>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
